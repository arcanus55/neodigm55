<script>
const guided_tour_Opt = {
    "steps": [
        {"boundQry":"#inp-txt__bound--1", "msg":["",""], "n55Poptart": {"Qx": 256, "Qy": 176, "z": 256, "Qh": 176, "Qw": 176, "position":"bottom", "arrow": true, "offset":{"h": 0, "l":0, "t":0, "w":0} }},
        {"boundQry":"#inp-txt__bound--2", "msg":["",""], "n55Poptart": {"Qx": 256, "Qy": 176, "z": 256, "Qh": 176, "Qw": 176, "position":"top", "arrow": true, "offset":{"h": 0, "l":0, "t":0, "w":0} }},
        {"boundQry":"#inp-txt__bound--3", "msg":["",""], "n55Poptart": {"Qx": 256, "Qy": 176, "z": 256, "Qh": 176, "Qw": 176, "position":"right", "arrow": true, "offset":{"h": 0, "l":0, "t":0, "w":0} }}
    ]
}
if( typeof guided_tour_Custom != 'undefined' ){  //  wdgt host script obj
    for( cnfgProp in guided_tour_Custom ){  //  Import Custom Objects props if exists
        guided_tour_Opt[ cnfgProp ] = guided_tour_Custom[ cnfgProp ]
    }
}

class Guided_tour {
    constructor(_d, _sQ) {
        this._d = _d; this._sQ = _sQ;
        this.isInit = this.bIsOpen = false;
        this.fOnBeforeOpen = this.fOnAfterOpen = this.fOnNav = this.fOnClose = null;
        this.state = { "popTartTmpl": null, "current": -1 }
    }
    init() {
        if( !this.isInit ){

        }
        this.isInit = true;
        return this;
    }
    next(){
        if( this.state.current < ( guided_tour_Opt.steps.length - 1 )){
            this.state.current++
            let elPopTartTmpl = this._d.querySelectorAll( this._sQ )[0]
elPopTartTmpl.removeAttribute("style")
            const elBound = this._d.querySelectorAll( guided_tour_Opt.steps[ this.state.current ].boundQry )[0]
console.log("----- elPopTartTmpl.style | " , elPopTartTmpl.style )
console.log("----- elPopTartTmpl.getAttribute( 'style' ) | " , elPopTartTmpl.getAttribute( 'style' ) )
console.log("----- elBound.getBoundingClientRect() | " , elBound.getBoundingClientRect() )
console.log("----- document.documentElement.scrollTop | " , document.documentElement.scrollTop )

            if( elPopTartTmpl && elBound ){
                neodigmPopTart.autoOpen( elPopTartTmpl, guided_tour_Opt.steps[ this.state.current ].n55Poptart, elBound )
            }
        }
    console.log("----- | " , this.state.current )
        return this
    }
    prev(){
        if( this.state.current >= 1 ){
            this.state.current--
            let elPopTartTmpl = this._d.querySelectorAll( this._sQ )[0]
elPopTartTmpl.removeAttribute("style")
            const elBound = this._d.querySelectorAll( guided_tour_Opt.steps[ this.state.current ].boundQry )[0]
console.log("----- elBound.getBoundingClientRect() | " , elBound.getBoundingClientRect() )
console.log("----- document.documentElement.scrollTop | " , document.documentElement.scrollTop )
            if( elPopTartTmpl && elBound ){
                neodigmPopTart.autoOpen( elPopTartTmpl, guided_tour_Opt.steps[ this.state.current ].n55Poptart, elBound )
            }
        }
    console.log("----- | " , this.state.current )
        return this
    }
    isOpen(){ return this.bIsOpen }
    setOnBeforeOpen( _f, id="def"){ this.fOnBeforeOpen[ id ] = _f }
    setOnAfterOpen( _f, id="def"){ this.fOnAfterOpen[ id ] = _f }
    setOnNav( _f, id="def"){ this.fOnNav[ id ] = _f }
    setOnClose( _f, id="def"){ this.fOnClose[ id ] = _f }
}
let guided_tour = new Guided_tour( document, "#guided-tour__tmpl--id" )
setTimeout( ()=>{ guided_tour.init() }, 1e3 )

</script>
