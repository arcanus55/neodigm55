<html>
    <head>
        <link rel="stylesheet" href="https://arcanus55.github.io/neodigm55/dist/neodigm55__v3_5.css"></link>
        <script src="https://arcanus55.github.io/neodigm55/dist/neodigm55__v3_5.js"></script>
        <link rel="stylesheet" href="https://arcanus55.github.io/neodigm55/dist/neodigm55_v1_0_launchComplete.css"></link>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.rawgit.com/mrdoob/three.js/master/examples/js/controls/OrbitControls.js"></script>
    </head>
    <body  data-n55-ampm-theme="light">


<!--  ||  TEMPLATE MU & CSS WDG BEGIN -->
<wtt-widget data-n55-token="effect_3d_spheres"
style="overflow: hidden;">
</wtt-widget>

<style>

</style>
<!--  ||  TEMPLATE MU & CSS WDG END -->














<!--  ||  JAVASCRIPT WDG BEGIN -->

<!--  ||  Dont copy script tags -->
<script>
const effect_3d_spheresConfig = {"context": "[data-n55-token='effect_3d_spheres']", "color": 0xEDBA08, "speed_x": 0.0004, "speed_y": 0.002, "camera_z": "+1500"}
const elWdgt = document.querySelector( effect_3d_spheresConfig.context )
elCntr = document.createElement('section')
elWdgt.appendChild(elCntr)

const width = window.innerWidth
const height = window.innerWidth

const renderer = new THREE.WebGLRenderer()
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(width, height)
elCntr.appendChild(renderer.domElement)

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(45, width / height)
camera.position.set(0, 0, effect_3d_spheresConfig.camera_z )

const pointLight = new THREE.PointLight(effect_3d_spheresConfig.color, 2.2, 1300)
scene.add(pointLight)

const geometry = new THREE.SphereGeometry(30, 32, 16)
const material = new THREE.MeshToonMaterial({color: effect_3d_spheresConfig.color, alphaHash: false, transparent: true, opacity: .108, side: THREE.DoubleSide,})

const group = new THREE.Group()
for (let i = 0; i < 976; i++) {
  let mesh = new THREE.Mesh(geometry, material)
  mesh.position.x = Math.random() * 2000 - 1000
  mesh.position.y = Math.random() * 2000 - 1000
  mesh.position.z = Math.random() * 2000 - 1000
  //mesh.rotation.x = Math.random() * 2 * Math.PI
  //mesh.rotation.y = Math.random() * 2 * Math.PI
  const scale = Math.random() * 2
  mesh.scale.x = mesh.scale.y = mesh.scale.z = scale
  mesh.matrixAutoUpdate = false
  mesh.updateMatrix()
  group.add(mesh)
}
scene.add(group)

scene.fog = new THREE.FogExp2(0x000000, 0.0002)
animate()

function animate () {
  requestAnimationFrame(animate)
  render()
}
function render () {
  group.rotation.x += effect_3d_spheresConfig.speed_x
  group.rotation.y += effect_3d_spheresConfig.speed_y
  renderer.render(scene, camera)
}

window.addEventListener('resize', onWdgtWindowResize, false)
onWdgtWindowResize()

function onWdgtWindowResize () {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
}


</script><!--  ||  Dont copy script tags -->
<!--  ||  JAVASCRIPT WDG END -->

    </body>
</html>
