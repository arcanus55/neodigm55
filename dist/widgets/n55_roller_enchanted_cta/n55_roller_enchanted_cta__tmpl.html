            <div class="n55-roller-control">

            <div class="n55-roller-control">
                <label for="n55-roller-text1">Primary Text:</label>
                <input type="text" id="n55-roller-text1" value="Click Me" data-n55-tulip='{"msg":"  Enter the text that will be displayed on the button by default.  This is the initial text users see before hovering.  Keep it concise and action-oriented.  Common examples: Click Me, Get Started, Learn More, Buy Now, Sign Up, Download, Submit, or Continue.  Supports plain text and emoji characters.","mrq":true,"tmpt":"","theme":"info","size":"small","position":"top","icon":""}' />

                <label for="n55-roller-text2">Hover Text:</label>
                <input type="text" id="n55-roller-text2" value="Let's Go!" data-n55-tulip='{"msg":"  Enter the alternate text that appears when users hover over the button.  This text slides up to replace the primary text, creating an engaging animation effect.  Use it to reinforce the action or add personality.  Examples: Lets Go!, Im Ready!, Click Here, Take Action, Yes Please!, Do It!, Start Now, or Join Us!  Only visible when hover animation is enabled.","mrq":true,"tmpt":"","theme":"info","size":"small","position":"top","icon":""}' />
            </div>

            <div class="n55-roller-control">
                <label for="n55-roller-hover-an">Enable Hover Animation:</label>
                <input type="checkbox" id="n55-roller-hover-an" checked data-n55-tulip='{"msg":"  Toggle the text swap animation that occurs on hover.  When enabled, hovering over the button causes the primary text to slide up and the hover text to slide into view from below.  When disabled, only the primary text displays and no animation occurs on hover.  The hover text (second span) is hidden when this is disabled.  Recommended to keep enabled for interactive, engaging buttons.","mrq":true,"tmpt":"","theme":"info","size":"small","position":"right","icon":""}' />

            <div class="n55-roller-control">

            <div class="n55-roller-control">
                <label for="n55-roller-toast">Toast Message:</label>

                    <option value="19">Sound 19</option>
                    <option value="20">Sound 20</option>
                    <option value="21">Sound 21</option>
                    <option value="22">Sound 22</option>
                    <option value="23">Sound 23</option>
                    <option value="24">Sound 24</option>
                </select>
            </div>

            <div class="n55-roller-control">
                <label for="n55-roller-sodapop">Soda Pop ID:</label>
                <input type="text" id="n55-roller-sodapop" value="" placeholder="Optional popup ID" data-n55-tulip='{"msg":"  Connect this button to a Soda Pop modal popup by entering the popup unique identifier.  When clicked, the button will trigger the associated popup to open instead of navigating to a URL.  The ID should match the data-n55-sodapop-id value of your target popup element.  Useful for displaying modal dialogs, forms, image galleries, or additional content without leaving the current page.  Leave empty if the button should not open a popup.","mrq":true,"tmpt":"","theme":"info","size":"small","position":"top","icon":""}' />
            </div>

            <div class="n55-roller-control">
                <label for="n55-roller-link">Link URL:</label>
                <input type="text" id="n55-roller-link" value="" placeholder="Optional link URL (leave empty for no link)" data-n55-tulip='{"msg":"  Enter a URL to make the button function as a hyperlink.  When provided, the button opens the specified URL in a new browser tab with security attributes (target blank and rel noopener).  Can be an absolute URL (https://example.com) or relative path (/about).  Leave empty to use the button for non-navigation actions like triggering popups, forms, or JavaScript functions.  When empty, clicking the button will not refresh or navigate the page.","mrq":true,"tmpt":"","theme":"info","size":"small","position":"top","icon":""}' />
            </div>
        </div>

        <div style="padding: 20px; background: #f5f5f5; border-radius: 8px;">
            <h3>Live Preview</h3>

<script>

class N55_roller_enchanted_cta {
    constructor() {
        this.button = null;
        this.markupTextarea = null;
        this.config = {
            size: 'medium',
            theme: 'brand',
            ambient: 'emit',
            text1: 'Click Me',
            text2: "Let's Go!",
            hoverAn: true,
            dontTouch: false,
            shapeOff: false,
            toast: '',
            tulip: '',
            sound: '',
            sodapop: '',
            link: ''
        };
    }

    init() {
        const self = this;

        // Get DOM elements
        this.button = document.getElementById('n55-roller-button');
        this.markupTextarea = document.getElementById('n55-roller-markup');

        // Get control elements
        const sizeSelect = document.getElementById('n55-roller-size');
        const themeSelect = document.getElementById('n55-roller-theme');
        const ambientSelect = document.getElementById('n55-roller-ambient');
        const text1Input = document.getElementById('n55-roller-text1');
        const text2Input = document.getElementById('n55-roller-text2');
        const hoverAnCheckbox = document.getElementById('n55-roller-hover-an');
        const dontTouchCheckbox = document.getElementById('n55-roller-dont-touch');
        const shapeOffCheckbox = document.getElementById('n55-roller-shape-off');
        const toastInput = document.getElementById('n55-roller-toast');
        const tulipInput = document.getElementById('n55-roller-tulip');
        const soundSelect = document.getElementById('n55-roller-sound');
        const sodapopInput = document.getElementById('n55-roller-sodapop');
        const linkInput = document.getElementById('n55-roller-link');
        const copyButton = document.getElementById('n55-roller-copy');

        // Add event listeners
        if (sizeSelect) {
            sizeSelect.addEventListener('change', function() {
                self.config.size = this.value;
                self.updateButton();
            });
        }

        if (themeSelect) {
            themeSelect.addEventListener('change', function() {
                self.config.theme = this.value;
                self.updateButton();
            });
        }

        if (ambientSelect) {
            ambientSelect.addEventListener('change', function() {
                self.config.ambient = this.value;
                self.updateButton();
            });
        }

        if (text1Input) {
            text1Input.addEventListener('input', function() {
                self.config.text1 = this.value;
                self.updateButton();
            });
        }

        if (text2Input) {
            text2Input.addEventListener('input', function() {
                self.config.text2 = this.value;
                self.updateButton();
            });
        }

        if (hoverAnCheckbox) {
            hoverAnCheckbox.addEventListener('change', function() {
                self.config.hoverAn = this.checked;
                self.updateButton();
            });
        }

        if (dontTouchCheckbox) {
            dontTouchCheckbox.addEventListener('change', function() {
                self.config.dontTouch = this.checked;
                self.updateButton();
            });
        }

        if (shapeOffCheckbox) {
            shapeOffCheckbox.addEventListener('change', function() {
                self.config.shapeOff = this.checked;
                self.updateButton();
            });
        }

        if (toastInput) {
            toastInput.addEventListener('input', function() {
                self.config.toast = this.value;
                self.updateButton();
            });
        }

        if (tulipInput) {
            tulipInput.addEventListener('input', function() {
                self.config.tulip = this.value;
                self.updateButton();
            });
        }

        if (soundSelect) {
            soundSelect.addEventListener('change', function() {
                self.config.sound = this.value;
                self.updateButton();
            });
        }

        if (sodapopInput) {
            sodapopInput.addEventListener('input', function() {
                self.config.sodapop = this.value;
                self.updateButton();
            });
        }

        if (linkInput) {
            linkInput.addEventListener('input', function() {
                self.config.link = this.value;
                self.updateButton();
            });
        }

        if (copyButton) {
            copyButton.addEventListener('click', function() {
                self.copyMarkup();
            });
        }

        // Initial update
        this.updateButton();

        return this;
    }

    updateButton() {
        if (!this.button) return;

        // Update button attributes
        this.button.setAttribute('data-n55-enchanted-cta-size', this.config.size);
        this.button.setAttribute('data-n55-theme', this.config.theme);
        this.button.setAttribute('data-n55-enchanted-cta-hover-an', this.config.hoverAn ? 'true' : 'false');
        this.button.setAttribute('data-n55-enchanted-cta-dont-touch', this.config.dontTouch ? 'true' : 'false');
        this.button.setAttribute('data-n55-enchanted-cta-shape-off', this.config.shapeOff ? 'true' : 'false');

        // Handle ambient animation
        if (this.config.ambient) {
            this.button.setAttribute('data-n55-enchanted-cta-ambient', this.config.ambient);
        } else {
            this.button.removeAttribute('data-n55-enchanted-cta-ambient');
        }

        // Handle toast
        if (this.config.toast) {
            this.button.setAttribute('data-n55-toast', this.config.toast);
        } else {
            this.button.removeAttribute('data-n55-toast');
        }

        // Handle tulip (tooltip)
        if (this.config.tulip) {
            const tulipObj = {
                msg: this.config.tulip,
                mrq: false,
                tmpt: "",
                theme: this.config.theme,
                size: this.config.size,
                position: "top",
                icon: ""
            };
            this.button.setAttribute('data-n55-tulip', JSON.stringify(tulipObj));
        } else {
            this.button.removeAttribute('data-n55-tulip');
        }

        // Handle sound/vibrate
        if (this.config.sound) {
            this.button.setAttribute('data-n55-wired4sound-click', this.config.sound);
        } else {
            this.button.removeAttribute('data-n55-wired4sound-click');
        }

        // Handle sodapop
        if (this.config.sodapop) {
            this.button.setAttribute('data-n55-sodapop-id', this.config.sodapop);
        } else {
            this.button.removeAttribute('data-n55-sodapop-id');
        }

        // Handle link URL
        if (this.config.link) {
            this.button.setAttribute('href', this.config.link);
            this.button.setAttribute('target', '_blank');
            this.button.setAttribute('rel', 'noopener');
        } else {
            this.button.removeAttribute('href');
            this.button.removeAttribute('target');
            this.button.removeAttribute('rel');
        }

        // Update button text
        const spans = this.button.querySelectorAll('span');
        if (spans[0]) spans[0].textContent = this.config.text1;
        if (spans[1]) spans[1].textContent = this.config.text2;

        // Re-initialize the enchanted CTA to apply changes
        if (typeof neodigmEnchantedCTA !== 'undefined' && neodigmEnchantedCTA.init) {
            neodigmEnchantedCTA.init();
        }

        // Update markup display
        this.updateMarkup();
    }

    updateMarkup() {
        if (!this.markupTextarea) return;

        const ambientAttr = this.config.ambient ? `\n    data-n55-enchanted-cta-ambient="${this.config.ambient}"` : '';
        const dontTouchAttr = this.config.dontTouch ? `\n    data-n55-enchanted-cta-dont-touch="true"` : '';
        const shapeOffAttr = this.config.shapeOff ? `\n    data-n55-enchanted-cta-shape-off="true"` : '';
        const toastAttr = this.config.toast ? `\n    data-n55-toast="${this.config.toast}"` : '';
        const tulipAttr = this.config.tulip ? `\n    data-n55-tulip='{"msg":"${this.config.tulip}","mrq":false,"tmpt":"","theme":"${this.config.theme}","size":"${this.config.size}","position":"top","icon":""}'` : '';
        const soundAttr = this.config.sound ? `\n    data-n55-wired4sound-click="${this.config.sound}"` : '';
        const sodapopAttr = this.config.sodapop ? `\n    data-n55-sodapop-id="${this.config.sodapop}"` : '';
        const linkAttrs = this.config.link ? ` href="${this.config.link}"\n    target="_blank" rel="noopener"` : '';

        const markup = `<a id="my-enchanted-cta"${linkAttrs}
    tabindex="0"
    data-n55-enchanted-cta${ambientAttr}
    data-n55-enchanted-cta-hover-an="${this.config.hoverAn ? 'true' : 'false'}"${dontTouchAttr}${shapeOffAttr}
    data-n55-enchanted-cta-size="${this.config.size}"
    data-n55-theme="${this.config.theme}"${toastAttr}${tulipAttr}${soundAttr}${sodapopAttr}
><span>${this.config.text1}</span><span>${this.config.text2}</span></a>`;

        this.markupTextarea.value = markup;
    }

    copyMarkup() {
        if (!this.markupTextarea) return;

        this.markupTextarea.select();
        this.markupTextarea.setSelectionRange(0, 99999); // For mobile devices

        try {
            document.execCommand('copy');
            alert('Markup copied to clipboard!');
        } catch (err) {
            // Fallback for modern browsers
            navigator.clipboard.writeText(this.markupTextarea.value).then(function() {
                alert('Markup copied to clipboard!');
            }).catch(function(err) {
                alert('Failed to copy markup. Please copy manually.');
            });
        }
    }
}

let n55_roller_enchanted_cta = new N55_roller_enchanted_cta( document, "n55_roller_enchanted_cta" )
n55_roller_enchanted_cta.init()
neodigmMarquee.init()
neodigmEnchantedCTA.init()




</script>
