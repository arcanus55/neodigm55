                if( sAct == "latin" ){

                }

                    this.elLang_english.textContent="check"

                }
                if( sAct == "gen" ){
                    const genLorumIpsum = ( Sentences=1 )=>{  //  Generate Lorum Ipsum | Orig Latin De finibus
                        if( Sentences == -1 ) Sentences = Math.floor(Math.random() * 5) + 1  //  If -1 gen rnd num sentences 1-5
                        let aLI = "lorem ipsum a ab accusamus accusantium ad adipiscing alias aliquam aliquid amet animi aperiam architecto asperiores aspernatur assumenda at atque aut autem beatae blanditiis commodi consectetur consequatur consequuntur corporis corrupti culpa cum cumque cupiditate debitis delectus deleniti deserunt dicta dignissimos distinctio do dolor dolore dolorem doloremque dolores doloribus dolorum dquis ducimus ea eaque earum eius eligendi enim eos error ert esse est et eum eveniet ex excepturi exercitationem expedita explicabo facere facilis fuga fugiat fugit harum hic id illo illum impedit in incididunt inventore ipsa ipsam irure iste itaque iusto labore laboriosam laborum laudantium libero magnam magni maiores maxime minima minus modi molestiae molestias mollitia nam natus necessitatibus nemo neque nesciunt nihil nisi nobis non nostrumd nulla numquam obcaecati odio odit officia officiis omnis optio pariatur perferendis perspiciatis placeat porro possimus praesentium provident quae quaerat quam quas quasi qui quia quibusdam quidem quis quisquam quo quod quos ratione recusandae reiciendis rem repellat repellendaus reprehenderit repudiandae rerudum rerum saepe sapiente sed sequi similique sint sit soluta sunt suscipit tempora tempore temporibus tenetur totam ullam unde ut vel velit veniam veritatis vero vitae voluptas voluptate voluptatem voluptates voluptatibus voluptatum".split(" ")
                        if( this.lang == "english" ) aLI = "a about absolutely accident action actionology admirable advocacy alchemy all an and angel animals anime answer anywhere application apprehension are arrester artisanal as asked atoms avant-garde awareness back bamboozle bananas barefoot based beauty best beyond blink bold book boost boy boys brand brandformance brands breakfast build but butterscotch buyer buyers by cadence can candy cash cellaphane centricity chain chaos claironic clarity clever clevor clevorvoyant clock clockwork coming common compass compel consensus contagious content context convergence conversational conviction convinced countenance counter crackerjack craftwork create creating crucial culture customer cut cutting damn data day decisis delirious delta depth design destroyed digital directed discerning discoverability distinctly doctor dog’s don't done doppelganger double dubious dust easy eat efficiency elastic electrokinetic emerging enablement enemy engage enigmatic enliven enterprise entice etch even every evocative evoked experience express extremely eyes faculties fad fall fast feasible ferver fishstick flow fluent fluid fly food for foray form freak fresh fringe from fruition fulcrum fundamental fusion future-proof game garish generation give glide glory gobsmackingly god golden gotta grokked grow guile hand happenstance he's heart help here high hold honey how however hyper-persuasive I iconic ideas ideation if imagine impossibilities in indigo infinite insipid into intuitive ion irrepressibly is isn’t it it's journeys joy keystone knot know latticework laureate leading-edge leapyear lengths let life like linchpin longing luxe madness majestic man many marketing me meaningful microsecond minds monkeys moonlight motion move movie moving my needle nevermore new noble noise nonsense not numbers observable of on once orgin other our outcome-based own page paragon pay pepper peppercoin physically piece pimento poet portal posh post                             if( (Math.floor(Math.random() * 10) + 1) >= (Math.floor(Math.random() * 10) + 1) ) return -1
                            return 1
                        })
                        let sOut = ""
                        for( let nS = 1; nS <= Sentences; nS++){
                            let nWc = Math.floor(Math.random() * 10) + 4  //  Word count per sentence rnd 4-10
                            for( let nW = 0; nW <= nWc; nW++){
                            let sWrd = aLI[ Math.floor(Math.random() * aLI.length) ]
                            if( !nW ) sWrd = sWrd[0].toUpperCase() + sWrd.slice(1)  //  Cap first

                            }

                        }
                        return sOut.trim();
                    }
                    this.eTermTo.value = genLorumIpsum( this.NumOfSentences )
                    neodigmUtils.robinTheme("warning")
                    if( neodigmWired4Sound ) neodigmWired4Sound.vibrate()
                    this.showResults( this.NumOfSentences + " Sentences Generated | Click Copy or Download as a File ")

                    this.NumOfSentences++
                    this.elCTA_createLorem__fb.textContent = `Create ${ this.NumOfSentences } Sentences`

                    if( this.NumOfSentences >= 2 ) this.NumOfSentences--
                    this.elCTA_createLorem__fb.textContent = `Create ${ this.NumOfSentences } Sentences`
                    if( neodigmWired4Sound ) neodigmWired4Sound.vibrate()

                    this.elKP_fb_cc.innerHTML = this.eTermTo.value.length

                        let elDLoad = document.createElement( "a" );
