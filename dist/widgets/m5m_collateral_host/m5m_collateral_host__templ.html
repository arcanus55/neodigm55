<script>
const elPage = document.querySelector("#page__id")
const params = new URLSearchParams(window.location.search)
const pGuid = params.get( "guid" )
if( elPage && pGuid ){
    const arySegs = elPage.src.split("/")
    arySegs[6] = pGuid
    elPage.src = arySegs.join("/")
}

let doSize = function( size ){
    if( elPage ){
        elPage.src = elPage.src.replace("/sm", "/"+ size)
        elPage.src = elPage.src.replace("/md", "/"+ size)
        elPage.src = elPage.src.replace("/lg", "/"+ size)
    }
    const elArt = document.querySelector("#m5m_collateral_host__id")
    if( elArt ) elArt.dataset.hostPageSize = size
}
    
const m5m_collateral_hostOpt = {
        "is_contact_cta_user_exit": [true, "Open popup form when the user is about to exit the tab."],
        "contact_cta_canvas_animation": [true, "Play reveal animation (wax on)."],
        "contact_cta_oid": ["123456789012345", "Salesforce CRM Web-to-Lead unique ID."],
        "contact_cta_retURL": ["/thank-you", "Post submit analytics URL. This page will not be visible to the end user."],
        "contact_cta_theme": ["brand", "Popup form color theme."],
        "contact_cta_unique_email": [true, "Timestamp each email address so that a new unique CRM lead can be created for each submit."]
    }
if( typeof m5m_collateral_hostCustom != 'undefined' ){  //  wdgt host script obj
    for( cnfgProp in m5m_collateral_hostCustom ){  //  Import Custom Objects props if exists
        m5m_collateral_hostOpt[ cnfgProp ] = m5m_collateral_hostCustom[ cnfgProp ]
    }
}
let cnfHex = m5m_collateral_hostOpt?.contact_cta_theme_hex || ["#EDBA08"]
document.documentElement.style.cssText = `--m5m_collateral_hostOpt: ${ cnfHex[0] }`

class M5m_collateral_host {
    constructor(_d, _sQ) {
        this._d = _d; this._sQ = _sQ;
        this.isInit = false;
        this.elCTA_btn = this.elCTA_elm = this.elCTA_message = null;
    }
    init() {
        if( !this.isInit ){

        }
        this.isInit = true;
        return this;
    }
}
let m5m_collateral_host = new M5m_collateral_host( document, "m5m_collateral_host" )
setTimeout( ()=>{ m5m_collateral_host.init() }, 1200 )


</script>
