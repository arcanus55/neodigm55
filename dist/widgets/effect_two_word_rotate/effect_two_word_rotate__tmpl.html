<script>
const effect_two_word_rotateOpt = {
        "word_one": ["Mach", "The first word of a two word phrase."],
        "word_two": ["Five", "The second word of a two word phrase."]
    }
if( typeof effect_two_word_rotateCustom != 'undefined' ){  //  wdgt host script obj
    for( cnfgProp in effect_two_word_rotateCustom ){  //  Import Custom Objects props if exists
        effect_two_word_rotateOpt[ cnfgProp ] = effect_two_word_rotateCustom[ cnfgProp ]
    }
}

class Effect_two_word_rotate {
    constructor(_d, _sQ) {
        this._d = _d; this._sQ = _sQ;
        this.isInit = false;
    }
    init() {
        if( !this.isInit ){
            let aMVLgo = [[4,8], [7,9], [13,19], [15,6], [21,20]];
            let _d = document;
            let eL = _d.querySelector(".js-lgo-para__left");
            let eR = _d.querySelector(".js-lgo-para__right");
            eL.textContent = effect_two_word_rotateOpt.word_one[0]
            eR.textContent = effect_two_word_rotateOpt.word_two[0]
            setInterval(function(){
                let nL = Math.floor(Math.random() * 4);
                nL = aMVLgo[ nL ][0];
                let sPrv = eL.dataset.fontHold;
                eL.classList.remove( sPrv );
                eL.classList.add( "font_fam" + nL );
                eL.dataset.fontHold = "font_fam" + nL;
            }, 2200);
            setInterval(function(){
                let nR = Math.floor(Math.random() * 4);
                nR = aMVLgo[ nR ][1];        
                let sPrv = eR.dataset.fontHold;
                eR.classList.remove( sPrv );
                eR.classList.add( "font_fam" + nR );
                eR.dataset.fontHold = "font_fam" + nR;
            }, 1000);
        }
        this.isInit = true;
        return this;
    }
}
let effect_two_word_rotate = new Effect_two_word_rotate( document, "effect_two_word_rotate" )
setTimeout( ()=>{ effect_two_word_rotate.init() }, 2e3 )


</script>
