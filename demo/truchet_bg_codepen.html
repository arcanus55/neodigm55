<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truchet Background - CodePen Version</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0F2435;  /*  --color-surface: m5mag */
    }
  </style>
</head>
<body>
<div style="height: 100vh; width: 100vw; position: absolute; top: 0; left: 0;">
    <truchet-bg
      data-mode="dark"
      data-brand="m5t"
      data-refresh="800"
      data-cell-width="56"
      data-interactive="true">
    </truchet-bg>
</div>

  <script>
    class TruchetBg extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.intervalId = null;
      }

      static get observedAttributes() {
        return ['data-mode', 'data-brand', 'data-refresh', 'data-cell-width', 'data-interactive'];
      }

      connectedCallback() {
        // Delay render to ensure dimensions are available
        requestAnimationFrame(() => {
          this.render();
          this.startRotation();
        });

        // Rebuild grid on resize
        this.resizeObserver = new ResizeObserver(() => {
          this.render();
        });
        this.resizeObserver.observe(this);
      }

      disconnectedCallback() {
        this.stopRotation();
        if (this.resizeObserver) {
          this.resizeObserver.disconnect();
        }
      }

      attributeChangedCallback(name, oldValue, newValue) {
        if (oldValue !== newValue) {
          if (name === 'data-refresh') {
            this.stopRotation();
            this.startRotation();
          } else {
            this.render();
          }
        }
      }

      get mode() {
        return this.getAttribute('data-mode') || 'light';
      }

      get brand() {
        return this.getAttribute('data-brand') || 'm5t';
      }

      get refresh() {
        return parseInt(this.getAttribute('data-refresh') || '800', 10);
      }

      get cellWidth() {
        return parseInt(this.getAttribute('data-cell-width') || '100', 10);
      }

      get interactive() {
        return this.getAttribute('data-interactive') === 'true';
      }

              display: grid;
              grid-template-columns: repeat(${cols}, 1fr);
              grid-auto-rows: ${actualCellWidth}px;
              width: 100%;
              height: 100%;
            }

            .grid-cell {
              width: 100%;
              height: ${actualCellWidth}px;
              position: relative;
              overflow: hidden;
            }

              content: '';
              position: absolute;
              top: 0;
              left: 0;

              background-repeat: no-repeat;

            }

            .grid-cell::after {
              content: '';
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background-size: cover;
              background-repeat: no-repeat;
              pointer-events: none;
              opacity: 0;
              transition: opacity 300ms ease-in-out;
            }

            .grid-cell[data-brand-graphic]::after {
              background-image: var(--brand-bg-image);
              opacity: 0.8;
            }
          </style>
          <div class="grid-container">
            ${this.generateCells(rows, cols, className)}
          </div>
        `;

        if (this.interactive) {
          this.attachHoverListeners();
        }
      }

      getBrandGraphicsCount() {
        const brand = this.brand;
        const maxBrandMap = {
          'm5t': 6
          // Add more brands here as needed
          // 'brand2': 3
        };
        return maxBrandMap[brand] || 0;
      }

      attachHoverListeners() {
        const cells = this.shadowRoot.querySelectorAll('.grid-cell');
        const maxGraphics = this.getBrandGraphicsCount();

        cells.forEach(cell => {
          cell.addEventListener('mouseenter', () => {
            if (maxGraphics === 0) return;

            const brand = this.brand;
            const randomGraphic = Math.floor(Math.random() * maxGraphics) + 1;
            const className = `truchet-bg-${brand}-${randomGraphic}`;

            // Apply the brand graphic class to the cell's ::after pseudo-element
            cell.classList.add('hovered');
            cell.setAttribute('data-brand-graphic', className);

            // Get the background image from the brand class
            const tempDiv = document.createElement('div');
            tempDiv.className = className;
            tempDiv.style.display = 'none';
            this.shadowRoot.appendChild(tempDiv);
            const bgImage = window.getComputedStyle(tempDiv).backgroundImage;
            this.shadowRoot.removeChild(tempDiv);

            cell.style.setProperty('--brand-bg-image', bgImage);

            const delay = Math.random() * 800 + 400; // Random between 800-2000ms
            setTimeout(() => {
              cell.classList.remove('hovered');
              cell.removeAttribute('data-brand-graphic');
              cell.style.removeProperty('--brand-bg-image');
            }, delay);
          });
        });
      }

      generateCells(rows, cols, className) {
        let cells = '';
        for (let i = 0; i < rows * cols; i++) {
          const rotation = Math.random() > 0.5 ? 90 : 0;
          cells += `<div class="grid-cell" data-bg-class="${className}" style="--bg-rotation: ${rotation}deg;"></div>`;
        }
        return cells;
      }

      startRotation() {
        this.stopRotation();

        this.intervalId = setInterval(() => {
          // 50% chance to skip this entire update cycle
          if (Math.random() > 0.5) return;

          const cells = this.shadowRoot.querySelectorAll('.grid-cell');
          cells.forEach(cell => {
            // 50% chance to change
            if (Math.random() > 0.5) {
              // 50% chance to be 90 degrees, otherwise 0
              const rotation = Math.random() > 0.5 ? 90 : 0;
              cell.style.setProperty('--bg-rotation', `${rotation}deg`);
            }
          });
        }, this.refresh);
      }

      stopRotation() {
        if (this.intervalId) {
          clearInterval(this.intervalId);
          this.intervalId = null;
        }
      }
    }

    customElements.define('truchet-bg', TruchetBg);
  </script>
</body>
</html>
